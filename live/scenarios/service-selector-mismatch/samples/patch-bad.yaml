# A Deployment — remediate.sh must REFUSE this patch: the only mutation the
# grader-side path allows is the storefront Service in the shop namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: nginx:1.27
