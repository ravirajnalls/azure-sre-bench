symptom: |
  cart-api returns bursts of 429 TooManyRequests from Cosmos DB during evening
  peak, yet the account-wide dashboard shows total RU consumption peaking at
  roughly 30% of provisioned throughput. Retries mask most of it, but
  p99 latency on AddToCart is up 4x and customers report abandoned carts.
