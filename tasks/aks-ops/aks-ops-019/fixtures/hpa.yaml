apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-gateway
  namespace: edge
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
