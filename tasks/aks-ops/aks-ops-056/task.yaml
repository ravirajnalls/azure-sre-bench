symptom: |
  After this morning's 06:15 UTC release, new billing-ui pods in the
  billing namespace never start — the Deployment rollout has been stuck at
  1/4 since, while the older replicas from last week's image keep serving
  normally. The registry is reachable from the cluster (other
  retailacr000a images pull fine), the release changed no manifest besides
  the image tag, and the team has already re-run the pipeline twice with
  the same result.
