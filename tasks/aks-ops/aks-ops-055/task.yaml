title: Zookeeper ensemble loses quorum a few times a week, always overnight
category: aks-ops
difficulty: hard
tags:
  - aks-ops
  - statefulset
  - cluster-autoscaler
  - poddisruptionbudget
  - quorum
symptom: |
  The 3-replica zookeeper StatefulSet in the streaming namespace drops
  quorum two or three times a week; downstream Kafka consumers stall each
  time. Every incident lands between 02:00 and 04:00 UTC and self-heals
  after roughly 40 minutes when the replicas rejoin on their own. Storage
  metrics look normal and no one deploys overnight, so the team has
  started suspecting the disks.
