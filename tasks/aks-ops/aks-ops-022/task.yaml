symptom: |
  A new ledger-db StatefulSet was rolled out to the finance namespace about
  thirty minutes ago and its first pod is still Pending. The PVC backing the
  pod reports Bound, and every node shows plenty of spare CPU and memory.
  No node pools were changed and no cluster upgrade is in progress.
