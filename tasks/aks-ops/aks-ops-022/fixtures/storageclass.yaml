apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-premium-zonal
provisioner: disk.csi.azure.com
parameters:
  skuName: Premium_LRS
  zoned: "true"
  cachingMode: ReadOnly
reclaimPolicy: Delete
mountOptions:
  - xfs
allowVolumeExpansion: true
volumeBindingMode: Immediate
