symptom: |
  The reporting-api release pipeline fails on kubectl apply: the deployment is
  rejected by an "admission webhook" with a wall of policy JSON and no
  human-readable reason, so developers do not know what to change. The image
  built and pushed successfully, no RBAC or pipeline permissions changed, and
  the same manifest deployed fine to the staging cluster yesterday.
