apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-api
  namespace: reporting
  labels:
    app: reporting-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reporting-api
  template:
    metadata:
      labels:
        app: reporting-api
    spec:
      containers:
        - name: reporting-api
          image: docker.io/contoso/reporting-api:1.4.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
      imagePullSecrets:
        - name: dockerhub-pull-secret
