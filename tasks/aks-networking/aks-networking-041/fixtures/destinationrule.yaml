# kubectl get destinationrule -n orders -o yaml
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: orders
  namespace: orders
  labels:
    app.kubernetes.io/managed-by: platform-team
spec:
  host: orders.orders.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
