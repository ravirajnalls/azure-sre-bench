symptom: |
  After migrating the catalog service to Application Gateway (AGIC), every
  external request returns 502 while the pods themselves are perfectly Ready —
  1/1 Running for days, restarts at zero. The catalog app answers in-cluster
  calls without a hitch. The old internal load balancer path never showed this
  behavior, nothing changed in the app's code, and the security review of the
  new path came back clean last week.
