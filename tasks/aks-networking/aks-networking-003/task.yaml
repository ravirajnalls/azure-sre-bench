symptom: >
  After scaling the checkout-api deployment from 2 to 6 replicas this
  morning, the new pods in the orders namespace have been stuck in
  ContainerCreating for over an hour, and the newly created checkout
  LoadBalancer Service still shows no external IP. The long-running
  partner-api LoadBalancer keeps serving on its address, existing pods are
  unaffected, all three cluster nodes report Ready, image pulls succeed,
  and there are no node-pressure or crash-loop events. Paged by the
  "pods stuck in ContainerCreating" alert at 08:41 UTC.
