apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  namespace: payments
  labels:
    app.kubernetes.io/name: pricing-api
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-api
    spec:
      containers:
        - name: pricing-api
          image: acrcheckoutprdcr.azurecr.io/pricing-api:2.14.3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
            - name: SPRING_PROFILES_ACTIVE
              value: production
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      imagePullSecrets:
        - name: acr-checkout-pull
