symptom: |
  During today's peak the pricing-api p99 response time tripled — checkout
  quote calls are timing out upstream — even though the
  HorizontalPodAutoscaler scaled the deployment from 4 to 12 pods. The
  Grafana CPU panel shows average CPU per pod at only ~45%, and nobody has
  touched the deployment or the node pool this week.
