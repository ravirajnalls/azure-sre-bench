# Deployed manifest for profile-svc in the profiles namespace.
# Image tag 2.4.0 was shipped in this morning's release ("build: refresh
# profile-svc runtime image"); no other fields were touched in that change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-svc
  namespace: profiles
  labels:
    app: profile-svc
    app.kubernetes.io/name: profile-svc
    app.kubernetes.io/part-of: customer-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: profile-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: profile-svc
    spec:
      serviceAccountName: profile-svc
      containers:
        - name: profile-svc
          image: profilesvc.azurecr.io/profile-svc:2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: LOG_LEVEL
              value: info
            - name: PGHOST
              value: pg-primary.profiles.svc.cluster.local
