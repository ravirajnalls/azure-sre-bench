apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: catalog
  uid: 00000000-0000-0000-0000-000000000004
  resourceVersion: "18920341"
  generation: 12
  creationTimestamp: "2026-09-02T14:22:41Z"
  annotations:
    deployment.kubernetes.io/revision: "7"
    kubernetes.io/change-cause: >-
      release v2.7.1: add cache warm-up step to cut first-request latency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: catalog-api
    spec:
      serviceAccountName: catalog-api
      containers:
        - name: catalog-api
          image: catalogprod00001.azurecr.io/catalog-api:v2.7.1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CACHE_WARMUP_ON_START
              value: "true"
            - name: CACHE_WARMUP_SOURCES
              value: "products-db.product_skus,top_categories"
            - name: DB_HOST
              value: products-db.catalog.svc.cluster.local
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      securityContext: {}
