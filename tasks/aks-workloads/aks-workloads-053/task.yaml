symptom: |
  Since the platform team reconciled the autoscaling manifests on Monday, the
  recommendations-api in the api namespace has been unstable: its replica
  count jumps up and down every few minutes, the pods' resource requests
  change on nearly the same cadence, and p99 latency spikes during each swing.
  Rolling the service back to the previous release did not help — the swings
  continued on the old build too.
