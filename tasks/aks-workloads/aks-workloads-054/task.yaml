symptom: |
  The nightly ledger-reconcile CronJob in the finance namespace has failed
  with ErrImagePull every night for the past week — the reconciliation batch
  never runs and the finance team is reconciling by hand. Nothing about the
  CronJob changed when it broke. The registry team "tidied" the image
  registry a few days before the first failure, and the cluster's other
  workloads keep pulling images without problems.
