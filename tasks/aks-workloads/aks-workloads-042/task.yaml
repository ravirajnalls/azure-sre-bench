symptom: |
  The billing namespace's invoice-worker Deployment has sat at 0 replicas all
  morning while the invoice Service Bus queue holds over 40,000 undelivered
  messages, so no invoices are going out. The deployment was healthy when it
  was last up, no rollouts or cluster changes have happened this week, and the
  billing namespace's other workloads behave normally. An engineer already
  bounced the deployment with no effect.
