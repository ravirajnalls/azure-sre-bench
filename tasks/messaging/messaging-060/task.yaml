title: Service Bus dead-letter queue fills while the main queue drains
category: messaging
difficulty: medium
tags:
  - messaging
  - azure
  - servicebus
  - dead-letter
  - queues
symptom: |
  Order throughput dropped to zero since yesterday morning: the orders Service
  Bus queue's own backlog is nearly empty, yet the dead-letter count is
  climbing by thousands of messages per hour and nothing reaches the order
  database. The orders-consumer service reports itself healthy and running,
  and the messaging namespace shows no signs of rate limiting.
