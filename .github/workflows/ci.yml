name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate task corpus
        env:
          # Optional until a task ships held-out: when the secret exists, rubrics
          # are decrypted and fully checked; when absent, held-out validation is
          # structure-only (issue #115). Blank-from-missing-secret == unset.
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        # `bench validate` exits non-zero on an empty corpus by design (issue #2),
        # so enforcement starts once the first task lands; from then on any PR
        # that breaks a task's structure, rubric, or fixtures fails here.
        run: |
          if compgen -G "tasks/*/*/task.yaml" > /dev/null; then
            python -m bench validate
          else
            echo "No tasks authored yet — corpus validation activates with the first task."
          fi

      - name: Fixture lint — all checkers, blocking (issues #150-#155)
        # Runs every registered checker (az, consistency, leaks, size, logs)
        # in one blocking gate: any ERROR-severity finding fails the build
        # (issue #155). WARNING/SKIPPED findings — unknown az prefixes,
        # advisory log-realism notes, custom-resource schema gaps — are
        # reported in the log for follow-up lint-fix PRs but never fail CI.
        # kubernetes-validate is not installed in this job, so the k8s check
        # degrades to one SKIPPED finding; the dedicated lint-fixtures job
        # validates k8s fixtures with real schemas.
        env:
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        run: python -m bench lint-fixtures

      - name: Task catalog is fresh (issue #42)
        # docs/TASKS.md is committed, so this works on an empty corpus too: a
        # PR that adds or edits tasks without regenerating the catalog fails
        # on the git diff.
        run: |
          python -m bench catalog
          git diff --exit-code docs/TASKS.md

      - name: Test suite (includes per-task integrity checks, issue #5)
        # See the validate step: HELDOUT_KEY is optional; integrity tests
        # decrypt-or-skip held-out rubrics (issue #115).
        env:
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        run: pytest -q

  # K8s fixture lint (issue #150): report invalid Kubernetes resources per
  # task. Separate job because it needs the kubernetes-validate schema
  # package; it joins the same blocking gate as the consolidated fixture
  # lint step (issue #155): non-zero on ERROR-severity findings, warnings
  # reported but non-blocking.
  lint-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # kubernetes-validate ships the offline kubernetes-json-schema
        # schemas the check validates against; not in requirements.txt
        # because only this check needs them.
        run: pip install -r requirements.txt kubernetes-validate

      - name: K8s fixture lint (blocking, issues #150 + #155)
        # Same blocking semantics as the consolidated fixture lint step:
        # exits non-zero on ERROR-severity findings; WARNING/SKIPPED
        # findings (custom resources with no upstream schema) are reported
        # but do not fail the run.
        run: python -m bench lint-fixtures --check k8s
