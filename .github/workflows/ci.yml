name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate task corpus
        env:
          # Optional until a task ships held-out: when the secret exists, rubrics
          # are decrypted and fully checked; when absent, held-out validation is
          # structure-only (issue #115). Blank-from-missing-secret == unset.
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        # `bench validate` exits non-zero on an empty corpus by design (issue #2),
        # so enforcement starts once the first task lands; from then on any PR
        # that breaks a task's structure, rubric, or fixtures fails here.
        run: |
          if compgen -G "tasks/*/*/task.yaml" > /dev/null; then
            python -m bench validate
          else
            echo "No tasks authored yet — corpus validation activates with the first task."
          fi

      - name: Fixture leak and size lint (issue #154)
        # `bench lint-fixtures` fails on any fixture that states a rubric
        # alternative, carries an answer-hint word, or exceeds the line
        # ceiling. HELDOUT_KEY is optional: a locked rubric skips the leak
        # scan and still gets the size checks.
        env:
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        run: python -m bench lint-fixtures

      - name: Task catalog is fresh (issue #42)
        # docs/TASKS.md is committed, so this works on an empty corpus too: a
        # PR that adds or edits tasks without regenerating the catalog fails
        # on the git diff.
        run: |
          python -m bench catalog
          git diff --exit-code docs/TASKS.md

      - name: Test suite (includes per-task integrity checks, issue #5)
        # See the validate step: HELDOUT_KEY is optional; integrity tests
        # decrypt-or-skip held-out rubrics (issue #115).
        env:
          HELDOUT_KEY: ${{ secrets.HELDOUT_KEY }}
        run: pytest -q

      - name: Fixture lint — az JSON shapes (warning-only, issue #151)
        # The az checker reports warnings/skips only, and lint-fixtures exits
        # non-zero solely on error-severity findings, so this job is
        # warning-only by construction: it surfaces shape violations without
        # blocking merges. Promote to blocking once the corpus is clean.
        run: python -m bench lint-fixtures --check az

      - name: Fixture lint — timestamps and log realism (warning-only, issue #153)
        # The logs checker reports WARNING-severity findings only, so like the
        # az step above this surfaces fixture problems without blocking
        # merges. Issue #155 owns promoting fixture checks to blocking.
        run: python -m bench lint-fixtures --check logs
